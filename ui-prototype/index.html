<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>A股尾盘买入法看板</title>
    <link rel="stylesheet" href="./style.css">
  </head>
  <body>
    <header class="topbar">
      <div class="brand">
        <span class="brand-mark">A</span>
        <div>
          <h1>尾盘买入法</h1>
          <p>板块确认 · 尾盘承接</p>
        </div>
      </div>

      <div class="status-strip" aria-label="看板状态">
        <span class="status-pill live" id="marketStatus">交易中</span>
        <span>刷新 <strong>3s</strong></span>
        <span>更新时间 <strong id="updatedAt">--:--:--</strong></span>
        <span>数据 <strong id="dataMode">实时</strong></span>
        <span>窗口 <strong id="buyWindow">跟踪</strong></span>
        <span>行情源 <strong id="quoteSource">实时接口</strong></span>
        <span>外链 <strong id="fastSite">测速中</strong></span>
      </div>

      <button class="refresh-btn" id="refreshBtn" type="button" aria-label="刷新候选">
        刷新
      </button>

      <a class="auth-btn" id="accountLink" href="./account.html" aria-label="进入用户中心">
        账户
      </a>
    </header>

    <main class="layout">
      <section class="board-list" aria-label="板块和候选股票">
        <div class="section-head">
          <div>
          <span class="eyebrow">Late-Day Lines</span>
          <h2>尾盘候选方向</h2>
          </div>
          <p>按板块强度、前排确认、承接弹性和次日纪律综合排序</p>
        </div>

        <div id="strategySummary" class="strategy-summary" aria-label="策略判断"></div>
        <div id="boards" class="boards"></div>
      </section>
    </main>

    <div class="auth-modal hidden" id="buyModal" role="dialog" aria-modal="true" aria-labelledby="buyTitle">
      <form class="auth-card" id="buyForm">
        <div class="auth-head">
          <div>
            <h2 id="buyTitle">记录买入</h2>
            <p id="buySubtitle">买入记录只保存到当前登录账号</p>
          </div>
          <button class="icon-btn" id="buyClose" type="button" aria-label="关闭">×</button>
        </div>

        <div class="buy-stock" id="buyStockName">--</div>

        <label class="field">
          <span>买入数量</span>
          <input id="buyQuantity" name="quantity" type="number" inputmode="numeric" min="100" step="100" required>
        </label>

        <label class="field">
          <span>买入价格</span>
          <input id="buyPrice" name="price" type="number" inputmode="decimal" min="0.01" step="0.01" required>
        </label>

        <p class="auth-message" id="buyMessage"></p>

        <div class="auth-actions two">
          <button class="primary-btn" type="submit">确认买入</button>
          <button class="secondary-btn" id="buyCancel" type="button">取消</button>
        </div>
      </form>
    </div>

    <script src="./app.js"></script>
  </body>
</html>
