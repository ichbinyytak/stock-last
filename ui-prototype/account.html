<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>用户中心 · 尾盘买入法</title>
    <link rel="stylesheet" href="./style.css">
  </head>
  <body>
    <header class="topbar account-topbar">
      <div class="brand">
        <span class="brand-mark">A</span>
        <div>
          <h1>用户中心</h1>
          <p>资金 · 持仓 · 历史</p>
        </div>
      </div>
      <a class="auth-btn" href="./index.html">看板</a>
    </header>

    <main class="layout account-layout">
      <section class="account-page compact">
        <div class="account-hero">
          <div>
            <span class="eyebrow">Account</span>
            <h2 id="accountTitle">账户数据</h2>
            <p id="authState">未登录</p>
          </div>
          <div class="account-actions">
            <button class="primary-btn" id="openLoginBtn" type="button">登录</button>
            <button class="secondary-btn" id="openPasswordBtn" type="button">改密</button>
            <button class="secondary-btn" id="accountLogoutBtn" type="button">退出</button>
          </div>
        </div>

        <div class="account-login-note" id="accountLoginNote">登录后查看个人资金、持仓和历史买卖。</div>

        <div class="account-summary-strip compact-summary auth-only">
          <div class="summary-item"><span>总金额</span><strong id="sumInitial">--</strong></div>
          <div class="summary-item"><span>现金</span><strong id="sumCash">--</strong></div>
          <div class="summary-item"><span>持仓市值</span><strong id="sumMarket">--</strong></div>
          <div class="summary-item"><span>总资产</span><strong id="sumAssets">--</strong></div>
          <div class="summary-item"><span>浮动盈亏</span><strong id="sumFloat">--</strong></div>
          <div class="summary-item"><span>总盈亏</span><strong id="sumTotalPnl">--</strong></div>
          <div class="account-summary-actions">
            <button class="secondary-btn" id="openMoneyBtn" type="button">编辑</button>
            <button class="secondary-btn" id="openTradeBtn" type="button">记录</button>
            <button class="secondary-btn hidden" id="syncPaperBtn" type="button">同步</button>
            <button class="secondary-btn hidden" id="runPaperBtn" type="button">自动运行</button>
          </div>
        </div>

        <div class="paper-status-line auth-only hidden" id="paperStatusLine"></div>

        <section class="account-section admin-only hidden" id="adminSection">
          <div class="section-line">
            <strong>用户管理</strong>
            <span>仅超级用户</span>
          </div>
          <div class="admin-user-line">
            <span id="adminUserCount">0 个服务器用户</span>
            <button class="secondary-btn" id="openAdminUserBtn" type="button">新增/重设</button>
          </div>
          <div class="history-list" id="adminUserList"></div>
        </section>

        <section class="account-section locked auth-only" id="positionsSection">
          <div class="section-line">
            <strong>持仓</strong>
            <span>点编辑修改数量、成本、现价</span>
          </div>
          <div class="editable-list compact-list" id="positionsList"></div>
        </section>

        <section class="account-section locked auth-only">
          <div class="section-line">
            <strong>历史买卖</strong>
            <span id="tradeCount">0 条</span>
          </div>
          <div class="history-list" id="historyList"></div>
        </section>
      </section>
    </main>

    <div class="auth-modal hidden" id="loginModal" role="dialog" aria-modal="true" aria-labelledby="loginTitle">
      <form class="auth-card" id="accountAuthForm">
        <div class="auth-head">
          <div>
            <h2 id="loginTitle">登录</h2>
            <p>使用管理员账号或已新增用户</p>
          </div>
          <button class="icon-btn" data-close="loginModal" type="button" aria-label="关闭">×</button>
        </div>
        <label class="field"><span>账号</span><input id="accountUsername" autocomplete="username" maxlength="24" required></label>
        <label class="field"><span>密码</span><input id="accountPassword" type="password" autocomplete="current-password" required></label>
        <p class="auth-message" id="accountMessage"></p>
        <div class="auth-actions">
          <button class="primary-btn" type="submit">登录</button>
        </div>
      </form>
    </div>

    <div class="auth-modal hidden" id="moneyModal" role="dialog" aria-modal="true" aria-labelledby="moneyTitle">
      <form class="auth-card" id="moneyForm">
        <div class="auth-head">
          <div>
            <h2 id="moneyTitle">编辑资金</h2>
            <p id="accountUserLabel">请先登录</p>
          </div>
          <button class="icon-btn" data-close="moneyModal" type="button" aria-label="关闭">×</button>
        </div>
        <label class="field"><span>账户总金额</span><input id="initialCapital" type="number" inputmode="decimal" min="0" step="0.01"></label>
        <label class="field"><span>可用现金</span><input id="cashAmount" type="number" inputmode="decimal" step="0.01"></label>
        <button class="primary-btn" type="submit">保存资金</button>
      </form>
    </div>

    <div class="auth-modal hidden" id="adminUserModal" role="dialog" aria-modal="true" aria-labelledby="adminUserTitle">
      <form class="auth-card" id="adminUserForm">
        <div class="auth-head">
          <div>
            <h2 id="adminUserTitle">新增/重设用户</h2>
            <p>由超级用户写入服务器用户表</p>
          </div>
          <button class="icon-btn" data-close="adminUserModal" type="button" aria-label="关闭">×</button>
        </div>
        <label class="field"><span>账号</span><input id="newManagedUsername" autocomplete="off" maxlength="24" required></label>
        <label class="field"><span>密码</span><input id="newManagedPassword" type="password" autocomplete="new-password" required></label>
        <button class="primary-btn" type="submit">保存用户</button>
      </form>
    </div>

    <div class="auth-modal hidden" id="tradeModal" role="dialog" aria-modal="true" aria-labelledby="tradeTitle">
      <form class="auth-card" id="tradeForm">
        <div class="auth-head">
          <div>
            <h2 id="tradeTitle">记录买卖</h2>
            <p>用于补录历史</p>
          </div>
          <button class="icon-btn" data-close="tradeModal" type="button" aria-label="关闭">×</button>
        </div>
        <select id="tradeType">
          <option value="BUY">买入</option>
          <option value="SELL">卖出</option>
        </select>
        <input id="tradeCode" placeholder="代码" required>
        <input id="tradeName" placeholder="名称" required>
        <input id="tradeQuantity" type="number" min="100" step="100" placeholder="数量" required>
        <input id="tradePrice" type="number" min="0.01" step="0.01" placeholder="价格" required>
        <button class="primary-btn" type="submit">记录</button>
      </form>
    </div>

    <div class="auth-modal hidden" id="sellDetailModal" role="dialog" aria-modal="true" aria-labelledby="sellDetailTitle">
      <div class="auth-card sell-detail-card">
        <div class="auth-head">
          <div>
            <h2 id="sellDetailTitle">卖出建议详情</h2>
            <p id="sellDetailSub">按次日开盘信息实时调整</p>
          </div>
          <button class="icon-btn" data-close="sellDetailModal" type="button" aria-label="关闭">×</button>
        </div>
        <div class="sell-detail-body" id="sellDetailBody"></div>
      </div>
    </div>

    <div class="auth-modal hidden" id="passwordModal" role="dialog" aria-modal="true" aria-labelledby="passwordTitle">
      <form class="auth-card" id="passwordForm">
        <div class="auth-head">
          <div>
            <h2 id="passwordTitle">修改密码</h2>
            <p>仅修改当前登录账号</p>
          </div>
          <button class="icon-btn" data-close="passwordModal" type="button" aria-label="关闭">×</button>
        </div>
        <label class="field"><span>旧密码</span><input id="oldPassword" type="password" autocomplete="current-password" required></label>
        <label class="field"><span>新密码</span><input id="newPassword" type="password" autocomplete="new-password" minlength="4" required></label>
        <button class="primary-btn" type="submit">保存密码</button>
      </form>
    </div>

    <script src="./account.js"></script>
  </body>
</html>
